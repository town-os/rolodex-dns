[package]
name = "rolodex-dns"
version = "0.5.0"
edition = "2024"
authors = ["Erik Hollensbe <git@hollensbe.org>"]
description = "A split-horizon DNS server and forwarding resolver with gRPC management"
license = "AGPL-3.0-only"
repository = "https://gitea.com/town-os/rolodex-dns"
homepage = "https://gitea.com/town-os/rolodex-dns"
readme = "README.md"
keywords = ["dns", "dns-server", "split-horizon", "grpc", "forwarding-resolver"]
categories = ["network-programming"]

# Explicit rather than umask-of-the-repo: the working tree carries a Go client,
# a JavaScript client, a browser extension, container tooling and a 196K spec
# that a crate consumer has no use for, and an `exclude` list would silently
# start shipping each new one of those.
#
# `proto/` and `build.rs` are load-bearing — the gRPC bindings are generated at
# build time, so a package without them does not compile. `benches/` is here
# because `[[bench]]` below names a target: cargo fails on a declared target
# whose file is missing, so omitting it breaks the package rather than merely
# shrinking it. `tests/` ships so the published crate can be verified by whoever
# receives it, which for an AGPL network service is the point.
#
# The documents are the ones a consumer actually reads: README.md is the
# reference, CONFIGURATION.md the task-oriented guide, CHANGELOG.md the history,
# and CLAUDE.md the functional specification the other three describe in parts.
# CLAUDE.md also has to ship for the package to be self-testing —
# `tests/promql_docs_test.rs` reads both it and README.md, and a package
# carrying the test but not its input is a test that cannot run.
# Every pattern is anchored with a leading `/`. Cargo matches these
# gitignore-style, so an unanchored `README.md` matches at *any* depth — which
# silently swept in every `js/node_modules/**/README.md` and the vendored zig
# toolchain's licence files, turning a 2 MB package into a junk drawer.
include = [
    "/src/**/*",
    "/proto/**/*",
    "/benches/**/*",
    "/tests/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/CONFIGURATION.md",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/LICENSE",
]

[dependencies]
# DNS
domain = { version = "0.11", features = ["std", "bytes", "resolv"] }
hickory-resolver = { version = "0.25", features = ["system-config", "tokio"] }
# `dnssec-ring` is what makes DNSKEY/DS/RRSIG/NSEC/NSEC3 parse as typed RDATA
# instead of opaque blobs, and brings the RSA verification (algorithm 8) that
# most of the real DNS is still signed with — `ring` cannot *generate* RSA keys,
# which is why we refuse to sign with it, but verifying is a different question
# and a validator that cannot check RSA cannot validate the root.
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
async-trait = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Database
rusqlite = { version = "0.35", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Duration parsing
fancy-duration = "0.9"

# Utilities
dashmap = "6"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
rand = "0.9"
nix = { version = "0.29", features = ["net"] }
socket2 = { version = "0.5", features = ["all"] }
sha2 = "0.10"
hex = "0.4"
bytes = "1"
hyper-util = "0.1"
tower = "0.5"

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
time = { version = "0.3", features = ["formatting"] }

# DoH
axum = { version = "0.8", features = ["http2"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"

# DoQ
quinn = "0.11"

# DNSSEC
ring = "0.17"

# Constant-time comparison for the gRPC shared secret. ring's own
# `verify_slices_are_equal` is deprecated and documented as internal-only with
# no side-channel promises; subtle is the purpose-built crate and is already in
# the tree transitively.
subtle = "2"

# DHCP
dhcproto = "0.14"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"

[[bin]]
name = "rolodex-dns"
path = "src/main.rs"

[[bin]]
name = "rolodex-dns-cli"
path = "src/bin/rolodex-dns-cli.rs"

[dev-dependencies]
rustls-webpki = { version = "0.103", features = ["ring", "std"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-test = "0.4"
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dns_perf"
harness = false

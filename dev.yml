database_path: /tmp/rolodex-dns-dev.db
forwarders:
  - "8.8.8.8:53"
  - "8.8.4.4:53"

# Each entry is a protocol (udp/tcp) mapped to a bind address.
# Bind addresses accept ip:port, [ipv6]:port, primary:port, or interface:port.
dns:
  bind:
    - udp: "127.0.0.1:5300"
    - tcp: "127.0.0.1:5300"
    - udp: "primary:5300"
    - tcp: "primary:5300"

grpc:
  tcp_bind: ""
  unix_socket: /tmp/rolodex-dns.sock
  shared_secret: ""

rbl:
  enabled: false
  providers: []

# DNSSEC validation of upstream answers. On by default; bogus data becomes
# SERVFAIL rather than being served. Anchored to the IANA root keys unless
# `trust_anchors` names others. Only the iterative path validates, so this has
# no effect in `resolution.mode: forward`.
dnssec:
  validate: true

# Prometheus scrape endpoint (plain HTTP). Remove this section to disable it.
metrics:
  bind: "127.0.0.1:9153"
